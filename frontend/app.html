<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Photo Storage</title>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/logo.svg">

    <!--Adding bootstrap library-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/files/css/main.css">

    <style>
      /* Separating sidebar and gallery. */
      #sidebar {
        width: 300px;
        height: 100vh;
      }

      #gallery {
        flex: 1;
        max-height: 100vh;
        overflow-y: scroll;
      }
    </style>
  </head>
  <body>
    <main style="display: flex;">
      <div id="sidebar" class="d-flex flex-column flex-shrink-0 p-3 bg-light"></div>
      <div id="gallery" class="d-flex flex-column flex-shrink-0 p-3"></div>
    </main>
    <script type="module">
      // Check if user is authenticated
      if (localStorage.getItem("auth_token")==null) {
          window.location.replace("/login");
      }

      // Loads Vue Gallery and Sidebar components
      import { createApp } from 'vue'
      import Gallery from './src/components/Gallery.vue'
      import Sidebar from './src/components/Sidebar.vue'

      createApp(Sidebar).mount("#sidebar")
      createApp(Gallery).mount('#gallery')
    </script>
  </body>
</html>
